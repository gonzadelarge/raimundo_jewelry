<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesús paga la coca</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 700;
        }

        h1 {
            font-size: clamp(5rem, 8vw, 6rem);
        }

        h2 {
            margin-top: 2rem;
            font-size: clamp(1rem, 5vw, 3.5rem);
        }
    </style>
</head>

<body>
    <main>
        <h1 id="title">PRIMER AVISO</h1>
        <h2 id="message">La paciencia se está agotando</h2>
    </main>

    <script>
        const notices = [
            {
                title: 'PRIMER AVISO',
                subtitle: 'La paciencia se agota'
            },
            {
                title: 'SEGUNDO AVISO',
                subtitle: 'Encapuchados rumanos van a por ti'
            },
            {
                title: 'DIMITRI HA SIDO INFORMADO',
                subtitle: 'Dice que te recuerda perfectamente'
            },
            {
                title: 'NO ENGAÑAS A NADIE',
                subtitle: 'Tu cartera lleva horas declarando'
            },
            {
                title: 'OPERACIÓN COBRO EN MARCHA',
                subtitle: 'Sabemos donde vives Jesús'
            },
            {
                title: 'JESÚS PAGA LA COCA',
                subtitle: 'Primer aviso'
            },
            {
                title: 'JESÚS JESUSITO',
                subtitle: 'Ya sabes, si no pagas paliza'
            },
            {
                title: 'ÚLTIMO AVISO',
                subtitle: 'Se acabaron las excusas Jesús'
            },
            {
                title: 'COMUNICADO OFICIAL',
                subtitle: 'Tu excusa ha sido rechazada por unanimidad'
            },
            {
                title: 'ALERTA DE BIZUM',
                subtitle: 'El botón de pagar lleva horas mirándote'
            },
            {
                title: 'PLAN B ACTIVADO',
                subtitle: 'Jesus, si no pagas la deuda se convertirá en problemas'
            },
            {
                title: 'TACAÑO',
                subtitle: 'Hoy invitas tú'
            },
            {
                title: 'SECCIÓN DE COBROS',
                subtitle: 'Aceptamos Bizum, efectivo y Piernas partidas'
            },
            {
                title: 'SABEMOS DONDE VIVES JESÚS',
                subtitle: 'El jefe no olvida y nosotros tampoco'
            },

            {
                title: 'DIMITRI VUELVE A PREGUNTAR',
                subtitle: 'Solo quiere saber quién trae la coca'
            },
            {
                title: 'AUDITORÍA DE EXCUSAS',
                subtitle: 'No se ha encontrado ninguna que funcione'
            }
        ];

        const title = document.querySelector('#title');
        const message = document.querySelector('#message');
        const oneMinute = 60 * 1000;

        function showNotice() {
            const index = Math.floor(Date.now() / oneMinute) % notices.length;
            title.textContent = notices[index].title;
            message.textContent = notices[index].subtitle;
        }

        showNotice();
        setInterval(showNotice, oneMinute);
    </script>
</body>

</html>
