<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesús paga la coca</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 700;
        }

        h1 {
            font-size: clamp(5rem, 8vw, 6rem);
        }

        h2 {
            margin-top: 2rem;
            font-size: clamp(1rem, 5vw, 3.5rem);
        }
    </style>
</head>

<body>
    <main>
        <h1 id="titulo">PRIMER AVISO</h1>
        <h2 id="aviso">La paciencia se está agotando</h2>
    </main>

    <script>
        const avisos = [
            {
                titulo: 'PRIMER AVISO',
                subtitulo: 'La paciencia se agota'
            },
            {
                titulo: 'SEGUNDO AVISO',
                subtitulo: 'Encapuchados rumanos van a por ti'
            },
            {
                titulo: 'DIMITRI HA SIDO INFORMADO',
                subtitulo: 'Dice que te recuerda perfectamente'
            },
            {
                titulo: 'NO ENGAÑAS A NADIE',
                subtitulo: 'Tu cartera lleva horas declarando'
            },
            {
                titulo: 'OPERACIÓN COBRO EN MARCHA',
                subtitulo: 'Sabemos donde vives Jesús'
            },
            {
                titulo: 'JESÚS PAGA LA COCA',
                subtitulo: 'Primer aviso'
            },
            {
                titulo: 'JESÚS JESUSITO',
                subtitulo: 'Ya sabes, si no pagas paliza'
            },
            {
                titulo: 'ÚLTIMO AVISO',
                subtitulo: 'Se acabaron las excusas Jesús'
            },
            {
                titulo: 'COMUNICADO OFICIAL',
                subtitulo: 'Tu excusa ha sido rechazada por unanimidad'
            },
            {
                titulo: 'ALERTA DE BIZUM',
                subtitulo: 'El botón de pagar lleva horas mirándote'
            },
            {
                titulo: 'PLAN B ACTIVADO',
                subtitulo: 'Jesus, si no pagas la deuda se convertirá en problemas'
            },
            {
                titulo: 'TACAÑO',
                subtitulo: 'Hoy invitas tú'
            },
            {
                titulo: 'SECCIÓN DE COBROS',
                subtitulo: 'Aceptamos Bizum, efectivo y Piernas partidas'
            },
            {
                titulo: 'SABEMOS DONDE VIVES JESÚS',
                subtitulo: 'El jefe no olvida y nosotros tampoco'
            },

            {
                titulo: 'DIMITRI VUELVE A PREGUNTAR',
                subtitulo: 'Solo quiere saber quién trae la coca'
            },
            {
                titulo: 'AUDITORÍA DE EXCUSAS',
                subtitulo: 'No se ha encontrado ninguna que funcione'
            }
        ];

        const titulo = document.querySelector('#titulo');
        const aviso = document.querySelector('#aviso');
        let indice = 0;
        const unaHora = 60 * 60 * 1000;

        setInterval(() => {
            indice = (indice + 1) % avisos.length;
            titulo.textContent = avisos[indice].titulo;
            aviso.textContent = avisos[indice].subtitulo;
        }, unaHora);
    </script>
</body>

</html>
