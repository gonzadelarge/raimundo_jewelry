<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Jesús paga la coca</title>
    <style>
        :root {
            color-scheme: dark;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            background: #000;
            color: #fff;
            font-family: system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Oxygen, Ubuntu, Cantarell, 'Open Sans', 'Helvetica Neue', sans-serif;
            text-align: center;
        }

        main {
            padding: 2rem;
        }

        h1,
        h2 {
            margin: 0;
            font-weight: 700;
        }

        h1 {
            font-size: clamp(5rem, 8vw, 6rem);
        }

        h2 {
            margin-top: 2rem;
            font-size: clamp(1rem, 5vw, 3.5rem);
        }
    </style>
</head>

<body>
    <main>
        <h1>JESÚS PAGA LA COCA</h1>
        <h2>Primer aviso</h2>
    </main>
</body>

</html>
